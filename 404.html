<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Johoe · 앱으로 돌아갑니다</title>

<link rel="icon" href="/johoe/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/johoe/apple-touch-icon.png">
<meta name="theme-color" content="#1C2B45">
<meta name="robots" content="noindex">

<style>
/* 앱과 같은 색을 쓰되, 곧바로 되돌아갈 페이지라 글꼴은 내려받지 않는다 */
:root{
  --ink:#1C2B45; --ink-70:#4A5871; --paper:#EDEBE3;
  --card:#FAF9F5; --line:#D6D2C4; --seal:#2E6F63; --r:3px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper); color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.box{
  background:var(--card); border:1px solid var(--line); border-top:5px solid var(--ink);
  border-radius:var(--r); padding:26px 24px; max-width:380px; width:100%;
}
h1{ font-family:'Gowun Batang',serif; font-size:19px; margin:0 0 12px; font-weight:700; }
p{ font-size:14px; line-height:1.75; color:var(--ink-70); margin:0 0 20px; }
a.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:48px; padding:0 20px; text-decoration:none;
  border:1px solid var(--seal); color:var(--seal);
  border-radius:var(--r); font-size:14px;
}
code{
  font-family:ui-monospace,monospace; font-size:12.5px;
  color:var(--ink-70); word-break:break-all;
}
</style>
</head>
<body>
<div class="box">
  <h1>주소를 찾지 못했습니다</h1>
  <p id="msg">Johoe 첫 화면으로 돌아갑니다…</p>
  <a class="btn" id="go" href="/johoe/">Johoe 열기</a>
</div>

<script>
/* ============================================================
   GitHub Pages 는 이 프로젝트 아래에서 없는 주소를 만나면 이 페이지를 보여 준다.
   주소를 잘못 눌렀거나 옛 주소를 즐겨찾기해 둔 경우가 대부분이므로 앱으로 돌려보낸다.

   두 가지를 지킨다.
     1) 학생 화면 주소(#/s/{반ID})가 붙어 있으면 그대로 들고 간다.
     2) 첫 화면마저 404 로 떨어지는 상황에서 무한히 되돌리지 않는다.
        방금 되돌린 적이 있으면 멈추고 단추만 보여 준다.
   ============================================================ */
(function(){
  /* 이 앱이 놓인 폴더 — /johoe/어떤/깊은/주소 여도 /johoe/ 를 얻는다.
     알아내지 못하면 뿌리(/)로 보내지 말고 알려진 위치로 되돌린다. */
  var m    = location.pathname.match(/^\/[^\/]+\//);
  var root = m ? m[0] : "/johoe/";
  var target = root + location.hash;   // 학생 화면 주소를 잃지 않는다

  var go = document.getElementById("go");
  go.setAttribute("href", target);

  /* 방금 이 페이지를 거쳐 갔는데 또 왔다면, 되돌려도 소용이 없다는 뜻이다 */
  var now = Date.now(), last = 0;
  try{ last = Number(sessionStorage.getItem("johoe404at")) || 0; }catch(e){}

  if(now - last < 5000){
    document.getElementById("msg").textContent =
      "첫 화면을 여는 데 실패했습니다. 잠시 뒤 아래 단추를 눌러 주세요.";
    return;
  }

  try{ sessionStorage.setItem("johoe404at", String(now)); }catch(e){}
  location.replace(target);
})();
</script>
</body>
</html>
